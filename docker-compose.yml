version: '3.8'

services:
  dagster:
    build:
      context: .
      dockerfile: src/Dockerfile
    container_name: dagster_orchestrator
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - dagster_home:/app/dagster_home
      - mlflow_data:/app/mlruns
    depends_on:
      - redpanda
    environment:
      - PYTHONPATH=/app
      - DAGSTER_HOME=/app/dagster_home
      - KAFKA_BOOTSTRAP_SERVERS=redpanda:9092
      - STREAM_MAX_RECORDS=40000000
      - PRODUCER_BATCH_SIZE=5000
      - CSV_ENCODING=cp1252
      - KAFKA_MAX_POLL_RECORDS=5000
      - KAFKA_POLL_TIMEOUT_MS=5000
      - KAFKA_IDLE_POLLS_LIMIT=5
      - KAFKA_IDLE_TIMEOUT_S=120
      - EXPORT_APPEND=false
      - MLFLOW_TRACKING_URI=http://mlflow:5000
    command: ["dagster-webserver", "-h", "0.0.0.0", "-p", "3000"]
    networks:
      - mlops_network

  dagster-daemon:
    build:
      context: .
      dockerfile: src/Dockerfile
    container_name: dagster_daemon
    volumes:
      - .:/app
      - dagster_home:/app/dagster_home
      - mlflow_data:/app/mlruns
    depends_on:
      - dagster
    environment:
      - PYTHONPATH=/app
      - DAGSTER_HOME=/app/dagster_home
      - KAFKA_BOOTSTRAP_SERVERS=redpanda:9092
      - STREAM_MAX_RECORDS=5000000
      - PRODUCER_BATCH_SIZE=5000
      - CSV_ENCODING=cp1252
      - KAFKA_MAX_POLL_RECORDS=5000
      - KAFKA_POLL_TIMEOUT_MS=5000
      - KAFKA_IDLE_POLLS_LIMIT=5
      - KAFKA_IDLE_TIMEOUT_S=120
      - EXPORT_APPEND=false
      - MLFLOW_TRACKING_URI=http://mlflow:5000
    command: ["dagster-daemon", "run"]
    networks:
      - mlops_network

  dbt:
    build:
      context: .
      dockerfile: src/Dockerfile
    container_name: dbt_runner
    working_dir: /app/dbt_project
    depends_on:
      - dagster
    command: ["dbt", "run", "--profiles-dir", "/app/dbt_project"]
    networks:
      - mlops_network

  redpanda:
    image: redpandadata/redpanda:v24.1.1
    container_name: redpanda
    command:
      - redpanda
      - start
      - --smp 1
      - --memory 1G
      - --reserve-memory 0M
      - --overprovisioned
      - --node-id 0
      - --kafka-addr PLAINTEXT://0.0.0.0:29092,OUTSIDE://0.0.0.0:9092
      - --advertise-kafka-addr PLAINTEXT://redpanda:29092,OUTSIDE://redpanda:9092
      - --pandaproxy-addr 0.0.0.0:8082
      - --advertise-pandaproxy-addr redpanda:8082
    ports:
      - "8081:8081"
      - "8082:8082"
      - "9092:9092"
      - "29092:29092"
    volumes:
      - redpanda_data:/var/lib/redpanda/data
    networks:
      - mlops_network

  mlflow:
    build:
      context: .
      dockerfile: src/Dockerfile
    container_name: mlflow_server
    ports:
      - "5000:5000"
    volumes:
      - .:/app
      - mlflow_data:/app/mlruns
    environment:
      - PYTHONPATH=/app
    command: ["mlflow", "server", "--host", "0.0.0.0", "--port", "5000", "--backend-store-uri", "sqlite:///app/mlflow.db", "--default-artifact-root", "/app/mlruns", "--allowed-hosts", "*"]
    networks:
      - mlops_network

  fastapi-app:
    build:
      context: .
      dockerfile: app/.dockerfile
    container_name: fastapi_anomaly
    ports:
      - "8000:8000"
    environment:
      - MLFLOW_TRACKING_URI=http://mlflow:5000
      - ENVIRONMENT=development
      - PYTHONPATH=/app
    volumes:
      - .:/app
      - /app/__pycache__
    entrypoint: ["uvicorn", "app.main:app"]
    command: ["--host", "0.0.0.0", "--port", "8000", "--reload"]
    depends_on:
      - mlflow
    networks:
      - mlops_network

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    networks:
      - mlops_network

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana_data:/var/lib/grafana
    networks:
      - mlops_network

networks:
  mlops_network:
    driver: bridge

volumes:
  redpanda_data:
  dagster_home:
  mlflow_data:
  prometheus_data:
  grafana_data: