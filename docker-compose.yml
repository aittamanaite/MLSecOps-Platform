version: '3.8'

services:
  dagster:
    build:
      context: .
      dockerfile: src/Dockerfile
    container_name: dagster_orchestrator
    working_dir: /app
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - dagster_home:/app/dagster_home
    depends_on:
      - redpanda
    environment:
      - PYTHONPATH=/app
      - DAGSTER_HOME=/app/dagster_home
      - KAFKA_BOOTSTRAP_SERVERS=redpanda:9092
      - KAFKA_RAW_TOPIC=raw-logs
      - KAFKA_CLEANED_TOPIC=cleaned-logs
      - KAFKA_ALERT_TOPIC=app-errors
