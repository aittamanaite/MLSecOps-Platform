name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8

      - name: Lint with flake8
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Run Pytest
        run: |
          pytest tests/ -v

      - name: Verify Python compilation
        run: |
          python -m py_compile src/streaming/producer.py
          python -m py_compile src/streaming/cleaner.py
          python -m py_compile src/streaming/inference.py
          python -m py_compile src/orchestration/assets.py
          python -m py_compile src/orchestration/definitions.py
          python -m py_compile src/quality/data_quality.py
          python -m py_compile src/ml/train.py
          python -m py_compile src/ml/predict.py

      - name: Build Docker Image
        run: |
          docker build -t mlsecops-platform:${{ github.sha }} -f src/Dockerfile .
